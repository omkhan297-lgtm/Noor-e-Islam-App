name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Backup App Code
        run: |
          mkdir -p ../temp_lib
          cp -r lib/* ../temp_lib/ || true

      - name: Create Clean Flutter Project
        run: |
          rm -rf * .github
          flutter create --org com.nooreislam .
          mkdir -p .github/workflows

      - name: Restore App Code
        run: |
          cp -r ../temp_lib/* lib/

      - name: Rebuild Workflow Script
        run: |
          cat << 'EOF' > .github/workflows/build.yml
          name: Build Android APK
          on:
            push:
              branches: [ main ]
          jobs:
            build:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-java@v4
                  with:
                    distribution: 'zulu'
                    java-version: '17'
                - uses: subosito/flutter-action@v2
                  with:
                    flutter-version: '3.19.x'
                    channel: 'stable'
                - run: flutter pub get
                - run: flutter build apk --release
                - uses: actions/upload-artifact@v4
                  with:
                    name: release-apk
                    path: build/app/outputs/flutter-apk/app-release.apk
          EOF

      - name: Build APK File
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
